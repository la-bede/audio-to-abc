<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Autotest Audio → ABC</title>
  <script type="importmap">
    { "imports": { "@tensorflow/tfjs": "../vendor/tfjs/tf.fesm.min.js" } }
  </script>
  <style>body{font:14px system-ui;margin:16px;background:#fff;color:#111}pre{background:#f4f4f4;padding:10px;white-space:pre-wrap}</style>
</head>
<body>
  <h1>Autotests Audio → ABC</h1>
  <p>1) Tests unitaires de la simplification (reprises / voltas) et de l'arrêt automatique.
     2) Mélodies synthétisées → Basic Pitch → ABC, comparées au résultat attendu. Aucun micro requis.
     Ajouter <code>?debug</code> à l'URL pour afficher les notes brutes.</p>
  <pre id="out">En cours…</pre>
  <script type="module">
    import { Transcriber } from '../js/transcriber.js';
    import { quantize, shouldAutoStop } from '../js/quantize.js';
    import { detectKey } from '../js/key.js';
    import { renderBars, layoutLinear, clipboardPayload, setHeaderField } from '../js/abc.js';
    import { defaultGroup, parseFraction } from '../js/tunetypes.js';
    import { simplify, layoutSimplified } from '../js/structure.js';
    import { getLang, setLang } from '../js/i18n.js';
    import { trackTempo, PlayDetector } from '../js/tempo.js';

    const out = document.getElementById('out');
    const report = location.search.includes('report');
    const debug = location.search.includes('debug');
    const log = (s) => { out.textContent += '\n' + s; };
    out.textContent = '';
    const initialLang = getLang();
    setLang('en'); // résumés vérifiés en anglais (langue par défaut), puis en français
    let allOk = true;
    const check = (name, got, expected) => {
      const ok = got === expected;
      allOk = allOk && ok;
      log(ok ? `OK     ${name}` : `ÉCART  ${name}\n  attendu : ${JSON.stringify(expected)}\n  obtenu  : ${JSON.stringify(got)}`);
    };

    // ---------------------------------------------------------------- 1. Tests unitaires
    log('=== Simplification (chaînes de mesures) ===');
    const part = (p, n = 8) => Array.from({ length: n }, (_, i) => `${p}${i + 1}`);
    const body = (bars, pickup = null, tol = 0) => {
      const res = simplify(bars, { tolerance: tol });
      const abc = res.repeated ? layoutSimplified({ head: 'H', pickup, bars }, res, 4) : layoutLinear({ head: 'H', pickup, bars, lastComplete: true }, 4, true);
      return { abc: abc.split('\n').slice(1).join('\n').trim(), summary: res.summary };
    };
    const A = part('A'), B = part('B');
    const alt = (bars, idx, p = 'X') => bars.map((b, i) => (idx.includes(i) ? `${p}${i + 1}` : b));

    check('AABB exact', body([...A, ...A, ...B, ...B]).abc,
      '|:A1|A2|A3|A4|\nA5|A6|A7|A8:|\n|:B1|B2|B3|B4|\nB5|B6|B7|B8:|');
    check('volta sur 1 mesure', body([...A, ...alt(A, [7])]).abc,
      '|:A1|A2|A3|A4|\nA5|A6|A7|1 A8:|2 X8|]');
    check('volta sur 2 mesures', body([...A, ...alt(A, [6, 7])]).abc,
      '|:A1|A2|A3|A4|\nA5|A6|1 A7|A8:|2 X7|X8|]');
    check('3 mesures différentes → voltas sur 4', body([...A, ...alt(A, [5, 6, 7])]).abc,
      '|:A1|A2|A3|A4|\n[1 A5|A6|A7|A8:|\n[2 A5|X6|X7|X8|]');
    check('volta sur 4 mesures', body([...A, ...alt(A, [4, 5, 6, 7])]).abc,
      '|:A1|A2|A3|A4|\n[1 A5|A6|A7|A8:|\n[2 X5|X6|X7|X8|]');
    check('5 mesures différentes → pas de reprise', body([...A, ...alt(A, [3, 4, 5, 6, 7])]).summary,
      'No repetition found.');
    const tour = body([...A, ...A, ...B, ...B, ...A, ...A, ...B, ...B]);
    check('AABB AABB → un seul tour', tour.abc, '|:A1|A2|A3|A4|\nA5|A6|A7|A8:|\n|:B1|B2|B3|B4|\nB5|B6|B7|B8:|');
    check('AABB AABB → résumé (EN)', tour.summary,
      'Parts of 8 bars · A: exact repeat · B: exact repeat · 2 rounds detected, 1 kept');
    setLang('fr');
    check('AABB AABB → résumé (FR)', body([...A, ...A, ...B, ...B, ...A, ...A, ...B, ...B]).summary,
      'Parties de 8 mesures · A : reprise exacte · B : reprise exacte · 2 tours détectés, 1 conservé');
    check('voltas → résumé (FR)', body([...A, ...alt(A, [6, 7])]).summary,
      'Parties de 8 mesures · A : reprise avec voltas (2 mesures)');
    check('aucune répétition → résumé (FR)', body([...A, ...alt(A, [3, 4, 5, 6, 7])]).summary, 'Aucune répétition trouvée.');
    setLang('en');
    check('voltas → résumé (EN)', body([...A, ...alt(A, [7])]).summary, 'Parts of 8 bars · A: repeat with 1-bar endings');
    check('levée devant |:', body([...A, ...A], 'P').abc, 'P|:A1|A2|A3|A4|\nA5|A6|A7|A8:|');
    check('variation au milieu, sans tolérance', body([...A, ...alt(A, [2])]).summary, 'No repetition found.');
    check('variation au milieu, tolérance 1', body([...A, ...alt(A, [2])], null, 1).abc, '|:A1|A2|A3|A4|\nA5|A6|A7|A8:|');
    check('A non répété puis BB', body([...A, ...B, ...B]).abc,
      'A1|A2|A3|A4|\nA5|A6|A7|A8\n|:B1|B2|B3|B4|\nB5|B6|B7|B8:|');

    log('\n=== Arrêt automatique ===');
    const n = (start, dur) => ({ start, dur, midi: 69, amp: 0.5 });
    const base = { captureStart: 0, t0: 2, barSec: 2, bars: 2, latency: 0 };
    check('silence de 2 mesures → arrêt', shouldAutoStop({ ...base, notes: [n(3, 2)], analyzedSec: 9 }).stop, true);
    check('silence de 1,5 mesure → continue', shouldAutoStop({ ...base, notes: [n(3, 2)], analyzedSec: 8 }).stop, false);
    check('aucune note → continue', shouldAutoStop({ ...base, notes: [], analyzedSec: 30 }).stop, false);
    check('bruit avant le décompte ignoré', shouldAutoStop({ ...base, notes: [n(-1, 0.2)], analyzedSec: 30 }).stop, false);
    check('arrêt auto désactivé', shouldAutoStop({ ...base, bars: 0, notes: [n(3, 2)], analyzedSec: 30 }).stop, false);

    log('\n=== Copie (presse-papiers compatible Writer) ===');
    {
      const cp = clipboardPayload('X: 1\nT: A<B & C\nK: Dmaj\n|:d2fd A2FA:|\n');
      check('texte : fins de ligne \\r\\n', cp.plain, 'X: 1\r\nT: A<B & C\r\nK: Dmaj\r\n|:d2fd A2FA:|\r\n');
      check('HTML : un paragraphe par ligne', (cp.html.match(/<p /g) || []).length, 4);
      check('HTML : caractères échappés', cp.html.includes('T: A&lt;B &amp; C'), true);
    }

    log('\n=== En-tête T: / R: après l\'enregistrement (setHeaderField) ===');
    {
      const abc = 'X: 1\nT: Sans titre\nM: 4/4\nL: 1/8\nK: Dmaj\nd2fd A2FA|dfed cABc|% retouche\n';
      const withR = setHeaderField(abc, 'R', 'reel');
      check('R: ajouté après T:', withR.split('\n').slice(0, 4).join(' | '), 'X: 1 | T: Sans titre | R: reel | M: 4/4');
      check('T: remplacé, corps retouché conservé', setHeaderField(withR, 'T', 'The Silver Spear'),
        'X: 1\nT: The Silver Spear\nR: reel\nM: 4/4\nL: 1/8\nK: Dmaj\nd2fd A2FA|dfed cABc|% retouche\n');
      check('R: vide → ligne retirée', setHeaderField(withR, 'R', ''), abc);
      check('R: ajouté après le dernier T: (titres alternatifs)',
        setHeaderField('X: 1\nT: A\nT: B\nM: 6/8\nK: G\nGAB|\n', 'R', 'jig'), 'X: 1\nT: A\nT: B\nR: jig\nM: 6/8\nK: G\nGAB|\n');
      check('pas de R: dans le corps (après K:)', setHeaderField('X: 1\nT: A\nK: G\nR: x\n', 'R', ''), 'X: 1\nT: A\nK: G\nR: x\n');
    }

    log('\n=== Groupement des notes selon la métrique (ancien réglage par type) ===');
    {
      const g = (m, l = '1/8') => defaultGroup(parseFraction(m), parseFraction(l).value);
      check('4/4 (reel, hornpipe…) : 4 croches', g('4/4'), 4);
      check('6/8 (jig) : 3', g('6/8'), 3);
      check('9/8 (slip jig) : 3', g('9/8'), 3);
      check('12/8 (slide) : 3', g('12/8'), 3);
      check('2/4 (polka) : 2', g('2/4'), 2);
      check('3/4 (waltz, mazurka) : 2', g('3/4'), 2);
      check('3/2 (three-two) : 4', g('3/2'), 4);
      check('3/8 (bourrée) : 3', g('3/8'), 3);
      check('4/4 en L:1/16 : 8', g('4/4', '1/16'), 8);
    }

    log('\n=== Suivi du tempo (trackTempo) et détection du début de jeu ===');
    {
      // Une note par croche, tempo qui accélère de 20 % sur 64 croches.
      const T0 = 0.15, U = 64, on = [];
      let tt = 0;
      for (let u = 0; u < U; u++) { on.push({ t: tt }); tt += T0 * (1 - 0.2 * u / U); }
      const tr = trackTempo(on, { unitSec: T0 });
      const trueEnd = T0 * (1 - 0.2 * (U - 1) / U);
      const errPct = Math.abs(tr.unitSecNow / trueEnd - 1) * 100;
      log(`  période finale estimée ${(tr.unitSecNow * 1000).toFixed(1)} ms, vraie ${(trueEnd * 1000).toFixed(1)} ms (écart ${errPct.toFixed(1)} %)`);
      check('accélération 20 % : période finale à ±2 %', errPct <= 2, true);
      check('accélération 20 % : dernière note sur la bonne croche', Math.round(tr.toUnits(on[U - 1].t)), U - 1);
      const steady = trackTempo(Array.from({ length: 32 }, (_, i) => ({ t: i * T0 })), { unitSec: T0 });
      check('tempo stable : période inchangée', Math.abs(steady.unitSecNow / T0 - 1) < 0.005, true);

      const det = new PlayDetector();
      let start = null;
      for (let i = 0; i < 120; i++) {               // blocs de ~43 ms
        const time = i * 0.0427;
        const click = i % 12 === 0 ? 0.08 : 0;      // clic bref toutes les ~0,5 s
        const play = time >= 3.0 ? 0.03 : 0;        // jeu à partir de 3,0 s
        start = det.push(time, Math.max(0.001, click, play));
      }
      check('début de jeu : clics brefs ignorés, jeu détecté à 3,0 s', start !== null && Math.abs(start - 3.0) < 0.05, true);
    }

    // ---------------------------------------------------------------- 2. Audio synthétisé
    // (midi, durée en croches)
    const bar1 = [[74, 2], [78, 1], [74, 1], [69, 2], [66, 1], [69, 1]];                 // d2fd A2FA
    const bar2 = [[74, 1], [78, 1], [76, 1], [74, 1], [73, 1], [69, 1], [71, 1], [73, 1]]; // dfed cABc
    const bar4a = [[71, 1], [67, 1], [66, 1], [64, 1], [62, 2], [66, 1], [69, 1]];        // BGFE D2FA
    const bar4b = [[71, 1], [67, 1], [66, 1], [64, 1], [62, 2], [69, 2]];                 // BGFE D2A2
    const bar5 = [[76, 2], [78, 1], [76, 1], [74, 2], [73, 1], [71, 1]];                  // e2fe d2cB
    const bar6 = [[69, 1], [71, 1], [73, 1], [74, 1], [76, 4]];                           // ABcd e4
    const bar8 = [[71, 1], [67, 1], [66, 1], [64, 1], [62, 4]];                           // BGFE D4
    // Cas avec tempo variable : `tempo` = facteur de durée des croches au début et à la fin (1 = métronome),
    // `swing` = croches inégales (0,1 → 55/45). Le mode tempo fixe y décale les barres (affiché pour info).
    const CASES = [
      {
        name: 'Reel en ré (levée)', M: '4/4', rhythm: 'reel', eighth: 0.15, barSteps: 8, groupSteps: 4, keyAbc: 'Dmaj', pickupFirst: true,
        tune: [[69, 1], ...bar1, ...bar2, ...bar1, [71, 1], [67, 1], [66, 1], [64, 1], [62, 4]],
        expected: 'A|d2fd A2FA|dfed cABc|d2fd A2FA|BGFE D4|]',
      },
      {
        name: 'Jig en sol (accidents)', M: '6/8', rhythm: 'jig', eighth: 0.2, barSteps: 6, groupSteps: 3, keyAbc: 'Gmaj', pickupFirst: true,
        tune: [[62, 1], [67, 1], [69, 1], [71, 1], [72, 1], [73, 1], [74, 1], [76, 3], [74, 1], [71, 1], [67, 1],
          [72, 1], [71, 1], [69, 1], [71, 1], [67, 1], [64, 1], [62, 1], [64, 1], [66, 1], [67, 3]],
        expected: 'D|GAB c^cd|e3 dBG|cBA BGE|DEF G3|]',
      },
      {
        name: 'Reel AABB (parties de 4 mesures) → simplification', M: '4/4', rhythm: 'reel', eighth: 0.15, barSteps: 8, groupSteps: 4, keyAbc: 'Dmaj',
        tune: [...bar1, ...bar2, ...bar1, ...bar4a, ...bar1, ...bar2, ...bar1, ...bar4b,
          ...bar5, ...bar6, ...bar5, ...bar8, ...bar5, ...bar6, ...bar5, ...bar8],
        expected: 'd2fd A2FA|dfed cABc|d2fd A2FA|BGFE D2FA|d2fd A2FA|dfed cABc|d2fd A2FA|BGFE D2A2|'
          + 'e2fe d2cB|ABcd e4|e2fe d2cB|BGFE D4|e2fe d2cB|ABcd e4|e2fe d2cB|BGFE D4|]',
        simplified: '|:d2fd A2FA|dfed cABc|d2fd A2FA|1 BGFE D2FA:|2 BGFE D2A2||\n|:e2fe d2cB|ABcd e4|e2fe d2cB|BGFE D4:|',
      },
      {
        name: 'Reel qui accélère (blanche 90 → 108)', M: '4/4', rhythm: 'reel', eighth: 60 / 90 / 4, barSteps: 8, groupSteps: 4, keyAbc: 'Dmaj',
        tempo: { start: 1, end: 90 / 108, swing: 0 }, trackOnly: true,
        tune: [...bar1, ...bar2, ...bar1, ...bar4a, ...bar1, ...bar2, ...bar1, ...bar8],
        expected: 'd2fd A2FA|dfed cABc|d2fd A2FA|BGFE D2FA|d2fd A2FA|dfed cABc|d2fd A2FA|BGFE D4|]',
      },
      {
        name: 'Reel qui ralentit avec swing 55/45 (levée)', M: '4/4', rhythm: 'reel', eighth: 0.15, barSteps: 8, groupSteps: 4, keyAbc: 'Dmaj',
        pickupFirst: true, tempo: { start: 1, end: 1.15, swing: 0.1 }, trackOnly: true,
        tune: [[69, 1], ...bar1, ...bar2, ...bar1, ...bar4a, ...bar1, ...bar2, ...bar1, ...bar8],
        expected: 'A|d2fd A2FA|dfed cABc|d2fd A2FA|BGFE D2FA|d2fd A2FA|dfed cABc|d2fd A2FA|BGFE D4|]',
      },
    ];
    const t0 = 1.0;       // temps 1 de la mesure 1 dans le fichier
    const SR = 22050;

    async function synth(tune, eighth, pickupFirst, tempo) {
      // Instants des croches : tempo qui évolue linéairement + swing éventuel.
      const units = tune.reduce((a, [, len]) => a + len, 0);
      const at = [0];
      for (let u = 0; u < units; u++) {
        const f = tempo ? tempo.start + (tempo.end - tempo.start) * u / units : 1;
        const sw = tempo?.swing || 0;
        const pu = pickupFirst ? u - 1 : u;          // parité par rapport au temps 1 de la mesure 1
        at.push(at[u] + eighth * f * (((pu % 2) + 2) % 2 === 0 ? 1 + sw : 1 - sw));
      }
      const origin = pickupFirst ? t0 - at[1] : t0; // la levée commence une croche avant t0
      const total = origin + at[units] + 1.0;
      const oc = new OfflineAudioContext(1, Math.ceil(total * SR), SR);
      let u = 0;
      for (const [midi, len] of tune) {
        const f = 440 * 2 ** ((midi - 69) / 12);
        const t = origin + at[u];
        const d = at[u + len] - at[u];
        u += len;
        const o = oc.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f;
        const lp = oc.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2500;
        const g = oc.createGain();
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.3, t + 0.01);
        g.gain.setValueAtTime(0.3, t + d - 0.03);
        g.gain.linearRampToValueAtTime(0, t + d - 0.005);
        o.connect(lp).connect(g).connect(oc.destination);
        o.start(t); o.stop(t + d);
      }
      return (await oc.startRendering()).getChannelData(0);
    }

    try {
      const tr = new Transcriber();
      const backend = await tr.load(new URL('../vendor/basic-pitch/model/model.json', import.meta.url).href);
      log(`\nMoteur : ${backend}, préchauffage ${tr.warmupMs.toFixed(0)} ms`);
      const p = { noteSensitivity: 0.5, splitSensitivity: 0.7, minNoteMs: 60, minMidi: 50, maxMidi: 90, melodia: true };
      for (const c of CASES) {
        log(`\n=== ${c.name} ===`);
        tr.reset();
        const audio = await synth(c.tune, c.eighth, c.pickupFirst, c.tempo);
        // Simulation du flux temps réel : blocs de 2048 échantillons, analyse au fil de l'eau.
        for (let i = 0; i < audio.length; i += 2048) {
          tr.push(audio.subarray(i, i + 2048));
          if (await tr.process(false)) tr.notes(p, false);
        }
        await tr.process(true);
        const notes = tr.notes(p, true);
        log(`Notes détectées : ${notes.length} (dernière inférence ${tr.lastInferMs.toFixed(0)} ms)`);
        if (debug) log(notes.map(x => `${x.midi}@${x.start.toFixed(2)}+${x.dur.toFixed(2)}`).join(' '));
        // Les deux modes : tempo fixe (métronome continu) et suivi du tempo de l'interprète.
        let r = null, key = null;
        for (const track of [false, true]) {
          const q = quantize(notes, { captureStart: 0, t0, latency: 0, unitSec: c.eighth, gridDiv: 1, barSteps: c.barSteps,
            pickup: 'auto', autoAlign: true, final: true, track });
          const last = [...q.events].reverse().find(e => e.midi != null);
          key = detectKey(q.events, { finalPc: last.midi % 12 });
          const rr = renderBars({ events: q.events, barSteps: c.barSteps, gridDiv: 1, groupSteps: c.groupSteps, key,
            header: { title: c.name, rhythm: c.rhythm, M: c.M, L: '1/8' } });
          const abc = layoutLinear(rr, 4, true);
          const bodyAbc = abc.trim().split('\n').slice(6).join('');
          const mode = track ? 'suivi du tempo' : 'tempo fixe';
          const tempoTxt = q.tempo ? `, croche ${(q.tempo.unitSecMax * 1000).toFixed(0)}→${(q.tempo.unitSecNow * 1000).toFixed(0)} ms` : `, recalage ${q.shiftMs} ms`;
          log(`[${mode}] levée ${q.pickupSteps}, tonalité ${key.session}${tempoTxt}\n${bodyAbc}`);
          if (track || !c.trackOnly) {
            check(`${c.name} — ${mode} — tonalité`, key.abc, c.keyAbc);
            check(`${c.name} — ${mode} — ABC linéaire`, bodyAbc, c.expected);
          } else {
            log(`  (tempo fixe : ${bodyAbc === c.expected ? 'identique' : 'barres décalées, comme attendu'})`);
          }
          if (track) r = rr;
          // Curseur de l'enregistrement : le début de la dernière note doit tomber sur sa position.
          if (track || !c.trackOnly) {
            // (les fragments de fin de note tenue, fusionnés par la quantification, sont exclus)
            const lastNote = notes.filter(x => x.dur >= 0.6 * c.eighth).reduce((a, b) => (b.start > a.start ? b : a));
            const lastEv = [...q.events].reverse().find(e => e.midi != null);
            check(`${c.name} — ${mode} — temps → position (curseur)`, Math.round(q.toSteps(lastNote.start - t0) - q.origin), lastEv.pos);
          }
        }
        if (c.simplified) {
          const res = simplify(r.bars, { tolerance: 0 });
          const sabc = layoutSimplified(r, res, 4);
          log(sabc + res.summary);
          check(`${c.name} — ABC simplifié`, sabc.trim().split('\n').slice(6).join('\n'), c.simplified);
        }
      }
    } catch (err) {
      allOk = false;
      log('ERREUR : ' + (err.stack || err));
    }
    setLang(initialLang); // rétablit le choix de langue du visiteur
    log(allOk ? '\nFIN : TOUS LES TESTS OK' : '\nFIN : ÉCHEC');
    document.title = allOk ? 'PASS' : 'FAIL';
    if (report) fetch('/__log', { method: 'POST', body: out.textContent }).catch(() => {});
  </script>
</body>
</html>
