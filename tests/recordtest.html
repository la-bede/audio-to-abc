<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>Test enregistrement</title>
</head>
<body>
  <!-- Pilote index.html dans un iframe : langue par défaut et bascule EN/FR mémorisée,
       deux enregistrements successifs (sans recharger), bouton Simplifier, analyse ABC par abcjs.
       L'état de l'application est lu dans document.body.dataset.state (idle|recording|stopping|done).
       À lancer avec Chrome --use-fake-device-for-media-stream --use-fake-ui-for-media-stream
       --autoplay-policy=no-user-gesture-required (le faux micro émet un bip périodique). -->
  <iframe id="app" src="../index.html" style="width:100%;height:90vh;border:0" allow="microphone"></iframe>
  <script>
    const lines = [];
    const log = (s) => { lines.push(s); };
    const send = () => fetch('/__log', { method: 'POST', body: lines.join('\n') }).catch(() => {});
    const wait = (ms) => new Promise(r => setTimeout(r, ms));
    const frame = document.getElementById('app');
    const loaded = () => new Promise(r => frame.addEventListener('load', r, { once: true }));
    const errors = [];

    function watch(w) {
      w.addEventListener('error', (e) => errors.push('ERREUR app : ' + e.message));
      w.addEventListener('unhandledrejection', (e) => errors.push('REJET app : ' + (e.reason && (e.reason.stack || e.reason))));
    }
    async function ready(d) {
      for (let i = 0; i < 100 && d.getElementById('recordBtn').disabled; i++) await wait(200);
    }
    const snapshot = (d) => `lang=${d.documentElement.lang} | bouton « ${d.getElementById('recordLabel').textContent} » | réglages « ${d.querySelector('[data-i18n="settings"]').textContent} » | statut « ${d.getElementById('status').textContent} »`;

    (async () => {
      await loaded();
      let w = frame.contentWindow, d = w.document;
      watch(w);
      await ready(d);
      log('Langue par défaut : ' + snapshot(d));

      // Lien ?lang=fr : la page doit s'ouvrir en français.
      frame.contentWindow.location.href = '../index.html?lang=fr';
      await loaded();
      w = frame.contentWindow; d = w.document; watch(w);
      await ready(d);
      log('Lien ?lang=fr : ' + snapshot(d));
      // Bascule EN : l'adresse suit ; puis retour FR par le bouton et rechargement sans paramètre : choix conservé.
      d.querySelector('.lang[data-lang="en"]').click();
      log('Clic EN → adresse ' + w.location.search + ' | ' + snapshot(d));
      d.querySelector('.lang[data-lang="fr"]').click();
      log('Clic FR → adresse ' + w.location.search);
      frame.contentWindow.location.href = '../index.html';
      await loaded();
      w = frame.contentWindow; d = w.document; watch(w);
      await ready(d);
      log('Rechargement sans paramètre : ' + snapshot(d));

      const $ = (id) => d.getElementById(id);
      const btn = $('recordBtn');
      log('\nMode tempo par défaut : ' + $('tempoMode').value);

      // Aperçu : l'en-tête ABC suit les réglages avant l'enregistrement.
      const header = () => $('abcText').value.trim().split('\n').filter(l => /^[RMK]:/.test(l)).join(' | ');
      log('Aperçu initial : ' + header());
      $('tuneType').value = 'jig'; $('tuneType').dispatchEvent(new Event('change'));
      $('keySelect').value = '9-dorian'; $('keySelect').dispatchEvent(new Event('change'));
      log('Aperçu après jig + Ador : ' + header());
      $('tuneType').value = 'reel'; $('tuneType').dispatchEvent(new Event('change'));
      $('keySelect').value = 'auto'; $('keySelect').dispatchEvent(new Event('change'));
      log('Lecteur visible avant transcription : ' + !$('playerBar').hidden);

      const modes = ['track-abc', 'track-level', 'fixed'];
      $('autoStop').value = '0'; $('autoStop').dispatchEvent(new Event('change')); // durée maîtrisée par le test
      for (let round = 1; round <= modes.length; round++) {
        $('tempoMode').value = modes[round - 1];
        $('tempoMode').dispatchEvent(new Event('change'));
        log(`\n--- Enregistrement ${round}, mode ${modes[round - 1]} (bouton : « ${$('recordLabel').textContent} ») ---`);
        btn.click();
        // 10 s d'enregistrement ; on note quand le clic s'arrête (body[data-click]).
        let auto = false, clickOff = null;
        const start = performance.now();
        for (let i = 0; i < 50; i++) {
          await wait(200);
          if (clickOff === null && d.body.dataset.click === 'off' && d.body.dataset.state === 'recording') {
            clickOff = `${((performance.now() - start) / 1000).toFixed(1)} s après le départ (${$('position').textContent})`;
          }
          if (i === 40) log('pendant : ' + $('position').textContent + ' | bouton : ' + $('recordLabel').textContent);
          if (d.body.dataset.state === 'done') { auto = true; break; }
        }
        log('clic arrêté : ' + (clickOff || 'non (clic jusqu\'à la fin)'));
        if (!auto) btn.click();
        log(auto ? 'arrêt automatique déclenché' : 'arrêt manuel');
        for (let i = 0; i < 50 && d.body.dataset.state !== 'done'; i++) await wait(200);
        await wait(500);
        log('après : ' + $('info').textContent);
        log('bouton : ' + $('recordLabel').textContent + ' | Simplifier visible : ' + !$('simplifyBtn').hidden);
        log('ABC :\n' + $('abcText').value.trim());
        if (round === 1) {
          // Lecteur fixé en bas (au-dessus de la barre d'enregistrement en largeur smartphone), en haut et en bas de page.
          for (const where of ['haut', 'bas']) {
            w.scrollTo(0, where === 'haut' ? 0 : d.documentElement.scrollHeight);
            await wait(400);
            const rect = $('playerBar').getBoundingClientRect();
            const tr = $('transport').getBoundingClientRect();
            const col = $('colRight').getBoundingClientRect();
            log(`lecteur (page en ${where}) : visible=${!$('playerBar').hidden}, bas=${Math.round(rect.bottom)} px / fenêtre ${w.innerHeight} px, barre d'enregistrement en haut à ${Math.round(tr.top)} px, gauche/largeur ${Math.round(rect.left)}/${Math.round(rect.width)} px (colonne partition ${Math.round(col.left)}/${Math.round(col.width)} px)`);
          }
          // Curseur et note en rouge pendant la lecture de l'enregistrement.
          const audio = $('recAudio');
          const cursorX = () => {
            const x = d.querySelector('#paper .abcjs-cursor')?.getAttribute('x1');
            return x == null ? 'absent' : `${Math.round(x)} (notes en rouge : ${d.querySelectorAll('#paper .abcjs-playing').length})`;
          };
          audio.currentTime = 3.5;
          try { await audio.play(); } catch (e) { log('lecture audio refusée : ' + e.message); }
          await wait(1200);
          const x1 = cursorX();
          await wait(1200);
          const x2 = cursorX();
          audio.pause();
          await wait(200);
          log(`curseur (enregistrement) : x=${x1} puis x=${x2} ; après pause : ${cursorX()}`);
          // Curseur pendant la lecture de l'ABC synthétisé (police de sons chargée depuis Internet).
          const play = d.querySelector('#synth .abcjs-midi-start');
          if (play) {
            play.click();
            let seen = 'absent';
            for (let i = 0; i < 40 && seen === 'absent'; i++) { await wait(250); seen = cursorX(); }
            await wait(800);
            log(`curseur (lecture ABC) : x=${seen} puis x=${cursorX()}`);
            play.click();
          }
        }
        $('simplifyBtn').click();
        await wait(400);
        log('simplifié : ' + $('structureInfo').textContent + ' | bouton : ' + $('simplifyBtn').textContent);
        log('partition : ' + (d.querySelector('#paper svg') ? 'oui' : 'non') + ', lecteur : ' + (d.querySelector('#synth .abcjs-inline-audio') ? 'oui' : 'non') + ', audio : ' + !$('recordingBox').hidden);
      }

      // Retour à l'anglais avec une transcription affichée : les textes dynamiques suivent.
      d.querySelector('.lang[data-lang="en"]').click();
      await wait(300);
      log('\nRetour EN : ' + snapshot(d));
      log('info EN : ' + $('info').textContent);
      log('structure EN : ' + $('structureInfo').textContent + ' | bouton : ' + $('simplifyBtn').textContent);

      // Vérifie qu'abcjs accepte la notation des voltas produite par la simplification.
      const sample = 'X: 1\nT: t\nM: 4/4\nL: 1/8\nK: Dmaj\nA|:d2fd A2FA|dfed cABc|d2fd A2FA|1 BGFE D2FA:|2 BGFE D2A2||\n' +
        '|:e2fe d2cB|ABcd e4|e2fe d2cB|BGFE D4|\n[1 A2FA dAFA|A2FA dAFA|A2FA dAFA|A2FA dAFA:|\n[2 A2FA dAFA|A2FA dAFA|A2FA dAFA|D8|]\n';
      const parsed = w.ABCJS.parseOnly(sample)[0];
      log('\nabcjs voltas : ' + (parsed.warnings && parsed.warnings.length ? parsed.warnings.join(' / ') : 'aucun avertissement'));
      log(errors.length ? errors.join('\n') : 'aucune erreur JS');
      log('FIN');
      send();
    })();
  </script>
</body>
</html>
